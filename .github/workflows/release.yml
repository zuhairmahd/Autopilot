name: Create and Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test-unit:
    name: Unit Tests (pwsh on Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          Write-Host "Using PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -lt 7) { Write-Error "PowerShell 7+ is required."; exit 1 }

      - name: Cache Pester module
        uses: actions/cache@v3
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Unit Tests with Coverage
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Unit -EnableCodeCoverage -CI -OutputVerbosity Detailed

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: |
            TestResults*.xml
            coverage.xml
          retention-days: 30

  test-integration:
    name: Integration Tests (pwsh on Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: test-unit
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Pester module
        uses: actions/cache@v3
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Integration Tests
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Integration -CI -OutputVerbosity Detailed

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-results
          path: |
            TestResults*.xml
            coverage.xml
          retention-days: 30

  test-comprehensive:
    name: Comprehensive Tests (pwsh on Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: test-integration
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Pester module
        uses: actions/cache@v3
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Comprehensive Tests
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Comprehensive -CI -OutputVerbosity Detailed

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: comprehensive-test-results
          path: |
            TestResults*.xml
            coverage.xml
          retention-days: 30

  build:
    name: Build (CreateRelease)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [test-unit, test-integration, test-comprehensive]
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache PowerShell modules
        uses: actions/cache@v3
        with:
          path: ~\Documents\PowerShell\Modules
          key: ${{ runner.os }}-pwsh-modules-${{ hashFiles('CreateRelease.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pwsh-modules-

      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Ensure hd directory exists
        shell: pwsh
        run: |
          if (-not (Test-Path -Path .\hd)) { New-Item -Path .\hd -ItemType Directory }

      - name: Build executable
        shell: pwsh
        run: |
          .\CreateRelease.ps1 -TargetsFile .\targets.psd1 -TargetName production -Overwrite -SkipSigning
          write-host "Build complete (release using target: production). Executable and lastrun.json are in the hd directory."

      - name: Upload build artifact
        uses: actions/upload-artifact@v3
        with:
          name: autopilot-build
          path: hd

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: build-logs
          path: logs/CreateRelease.log
          retention-days: 14

  sign:
    name: Code Signing (Trusted Signing)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    if: github.event_name == 'release' && github.event.action == 'published'
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v3
        with:
          name: autopilot-build
          path: hd

      - name: Check for signing secrets
        id: check_secrets
        shell: pwsh
        run: |
          if (-not "$env:AZURE_TENANT_ID" -or -not "$env:AZURE_CLIENT_ID" -or -not "$env:AZURE_CLIENT_SECRET") {
            Write-Host "::set-output name=skip_signing::true"
          } else {
            Write-Host "::set-output name=skip_signing::false"
          }

      - name: Sign files with Trusted Signing
        if: steps.check_secrets.outputs.skip_signing == 'false'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: zuhairmahd
          certificate-profile-name: Cert1
          files-folder: ${{ github.workspace }}/hd
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: update hash
        shell: pwsh
        run: |
          Copy-Item -Path .\hd\main.exe -Destination .\main.exe -Force 
          Write-Host "Copied .\hd\main.exe to .\main.exe."
          Copy-Item -Path .\hd\lastrun.json -Destination .\lastrun.json -Force
          write-host "Copied .\hd\lastrun.json to .\lastrun.json."
          .\CreateRelease.ps1 -TargetsFile .\targets.psd1 -TargetName production -Overwrite -updateHash

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v3
        with:
          name: signed-artifacts
          path: |
            ./hd/main.exe
            ./hd/lastrun.json

  release:
    name: Upload Release Assets
    runs-on: windows-latest
    needs: sign
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@v3
        with:
          name: signed-artifacts
          path: ./release-assets

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./release-assets/main.exe
            ./release-assets/lastrun.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
