name: Pull Request Checks

on:
  pull_request:
    branches:
      - master
      - dev
      - lhm
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test-unit:
    name: Unit Tests with Coverage
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Build C# DLLs
        shell: pwsh
        run: |
          Write-Host "Building C# DLLs for performance optimization..."
          .\Build-NativeDlls.ps1 -Configuration Release
          Write-Host "C# DLLs built successfully"

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          Write-Host "Using PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -lt 7) { 
            Write-Error "PowerShell 7+ is required."
            exit 1 
          }

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Unit Tests with Code Coverage
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Unit -EnableCodeCoverage -CI

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            TestResults*.xml
            coverage.xml
          retention-days: 7

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always()
        with:
          files: TestResults*.xml
          check_name: Unit Test Results
          comment_mode: off

  test-integration:
    name: Integration Tests
    runs-on: windows-latest
    timeout-minutes: 15
    needs: test-unit
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Integration Tests
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Integration -CI

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            TestResults*.xml
          retention-days: 7

      - name: Publish Integration Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always()
        with:
          files: TestResults*.xml
          check_name: Integration Test Results
          comment_mode: off

  test-comprehensive:
    name: Comprehensive Tests (Optional)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: test-integration
    # Only run on PRs to master or when explicitly requested via label
    if: |
      github.base_ref == 'master' ||
      contains(github.event.pull_request.labels.*.name, 'run-comprehensive-tests')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Comprehensive Tests
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Comprehensive -CI

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-results
          path: |
            TestResults*.xml
          retention-days: 7

      - name: Publish Comprehensive Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: always()
        with:
          files: TestResults*.xml
          check_name: Comprehensive Test Results
          comment_mode: off

  code-quality:
    name: Code Quality Checks
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

          $results = Invoke-ScriptAnalyzer -Path . -Recurse -Settings PSGallery -ExcludeRule PSAvoidUsingWriteHost

          if ($results) {
            $results | Format-Table -AutoSize
            $errorCount = ($results | Where-Object Severity -eq 'Error').Count
            $warningCount = ($results | Where-Object Severity -eq 'Warning').Count
            
            Write-Host "`nSummary: $errorCount errors, $warningCount warnings" -ForegroundColor $(if ($errorCount -gt 0) { 'Red' } else { 'Yellow' })
            
            if ($errorCount -gt 0) {
              Write-Error "PSScriptAnalyzer found $errorCount error(s). Please fix them before merging."
              exit 1
            }
          } else {
            Write-Host "No PSScriptAnalyzer issues found!" -ForegroundColor Green
          }

  summary:
    name: Test Summary
    runs-on: windows-latest
    needs: [test-unit, test-integration, code-quality]
    if: always()
    steps:
      - name: Check test results
        shell: pwsh
        run: |
          $unitResult = '${{ needs.test-unit.result }}'
          $integrationResult = '${{ needs.test-integration.result }}'
          $codeQualityResult = '${{ needs.code-quality.result }}'

          Write-Host "Test Results Summary:" -ForegroundColor Cyan
          Write-Host "  Unit Tests: $unitResult" -ForegroundColor $(if ($unitResult -eq 'success') { 'Green' } else { 'Red' })
          Write-Host "  Integration Tests: $integrationResult" -ForegroundColor $(if ($integrationResult -eq 'success') { 'Green' } else { 'Red' })
          Write-Host "  Code Quality: $codeQualityResult" -ForegroundColor $(if ($codeQualityResult -eq 'success') { 'Green' } else { 'Red' })

          if ($unitResult -ne 'success' -or $integrationResult -ne 'success' -or $codeQualityResult -ne 'success') {
            Write-Error "One or more checks failed. Please review the results above."
            exit 1
          }
          else {
            Write-Host "`nAll checks passed! ✓" -ForegroundColor Green
          }
