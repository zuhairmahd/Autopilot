name: test-build-release

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: write

jobs:
  test:
    name: Test (pwsh on Windows)
    runs-on: windows-latest
    # Skip CI loop commits
    if: >
      github.event_name != 'push' ||
      !contains((github.event.head_commit.message || github.event.pull_request.title || ''), '[skip ci]')
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          Write-Host "Using PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -lt 7) { Write-Error "PowerShell 7+ is required."; exit 1 }

      - name: Run tests - syntax
        shell: pwsh
        run: .\TestScripts\Test-Runner.ps1 -TestCategory syntax

      - name: Run tests - core
        shell: pwsh
        run: .\TestScripts\Test-Runner.ps1 -TestCategory core

      - name: Run tests - unit
        shell: pwsh
        run: .\TestScripts\Test-Runner.ps1 -TestCategory unit

      - name: Run tests - integration
        shell: pwsh
        run: .\TestScripts\Test-Runner.ps1 -TestCategory integration

  build:
    name: Build (CreateRelease test version)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: test
    # Only build on pushes to dev and skip CI loop commits
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      !contains((github.event.head_commit.message || ''), '[skip ci]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: ${{ runner.os }}-pwsh-modules-${{ hashFiles('CreateRelease.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pwsh-modules-

      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Ensure bin directory exists
        shell: pwsh
        run: |
          if (-not (Test-Path -Path .\bin)) { New-Item -Path .\bin -ItemType Directory }

      - name: Build executable
        shell: pwsh
        run: |
          .\CreateRelease.ps1 -InputFile .\main.ps1 -outputPath bin -Overwrite -SkipSigning 
          copy-item -path .\lastrun.json -destination .\bin\lastrun.json -Force
          write-host "Build complete. Executable and lastrun.json are in the bin directory."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-build
          path: bin

  sign:
    name: Code Signing (Trusted Signing)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    # Only sign on pushes to dev and skip CI loop commits
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/dev' &&
      !contains((github.event.head_commit.message || ''), '[skip ci]')
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Ensure we can push back to the same branch
          persist-credentials: true
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: autopilot-build
          path: bin

      - name: Skip signing (missing secrets)
        if: env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_ID == '' || env.AZURE_CLIENT_SECRET == ''
        shell: pwsh
        run: |
          Write-Host "Signing skipped: required Azure Trusted Signing secrets not configured."

      - name: Sign files with Trusted Signing
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: zuhairmahd
          certificate-profile-name: Cert1
          files-folder: ${{ github.workspace }}/bin
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Commit signed artifacts to repository
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          Copy-Item -Path .\bin\main.exe -Destination .\main.exe -Force 
          Write-Host "Copied .\bin\main.exe to .\main.exe."
          Copy-Item -Path .\bin\lastrun.json -Destination .\lastrun.json -Force
          write-host "Copied .\bin\lastrun.json to .\lastrun.json." 
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only the build directory, lastrun.json and main.exe to avoid unrelated changes from the artifact download
          git add -A bin
          git add -A main.exe
          git add -A lastrun.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $branch = '${{ github.ref_name }}'
            git commit -m "chore(build): update signed artifacts [skip ci]"
            git push origin HEAD:$branch
            Write-Host "Signed artifacts committed and pushed to $branch"
          }
          else {
            Write-Host "No changes to commit."
          }