name: PowerShell CI/CD

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  code-analysis:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install PSScriptAnalyzer
      shell: powershell
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck
    
    - name: Run PSScriptAnalyzer
      shell: powershell
      run: |
        $results = Invoke-ScriptAnalyzer -Path *.ps1 -Recurse -Severity Error
        if ($results) {
          $results | Format-Table -AutoSize
          Write-Error "PSScriptAnalyzer found issues"
          exit 1
        } else {
          Write-Host "PSScriptAnalyzer passed"
        }
  