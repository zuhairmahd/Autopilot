name: test-build-release

# This workflow runs on direct pushes to dev/lhm branches
# For pull requests, use pr-checks.yml instead to avoid duplicate test runs
on:
  push:
    branches:
      - dev
      - lhm
    # Exclude pushes that are part of pull requests by checking commit message
    # PR syncs will have [skip ci] or we can filter by not running on PR branches

permissions:
  contents: write

jobs:
  test-unit:
    name: Unit Tests (pwsh on Windows)
    runs-on: windows-latest
    # Skip CI loop commits
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          Write-Host "Using PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -lt 7) { Write-Error "PowerShell 7+ is required."; exit 1 }

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Unit Tests
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Unit -CI -OutputVerbosity Detailed

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            TestResults*.xml
            coverage.xml
          retention-days: 30

  test-comprehensive:
    name: Comprehensive Tests (pwsh on Windows)
    runs-on: windows-latest
    needs: test-unit
    #skip CI for PR syncs
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Comprehensive Tests
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Comprehensive -CI -OutputVerbosity Detailed

      - name: Upload comprehensive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-test-results
          path: |
            TestResults*.xml
            coverage.xml
          retention-days: 30

  test-integration:
    name: Integration Tests (pwsh on Windows)
    runs-on: windows-latest
    needs: [test-unit, test-comprehensive]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Pester module
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules\Pester
          key: ${{ runner.os }}-pester-${{ hashFiles('**/Invoke-PesterTests.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pester-

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0.0 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Integration Tests
        shell: pwsh
        run: |
          .\Invoke-PesterTests.ps1 -TestType Integration -CI -OutputVerbosity Detailed

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            TestResults*.xml
            coverage.xml
          retention-days: 30

  # ===================== DYNAMIC BRANCH BUILD & SIGN =====================
  build:
    name: Build (${{ github.ref_name }} branch)
    runs-on: windows-latest
    timeout-minutes: 25
    needs: [test-unit, test-integration, test-comprehensive]
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache PowerShell modules
        uses: actions/cache@v4
        with:
          path: ~\Documents\PowerShell\Modules
          key: ${{ runner.os }}-pwsh-modules-${{ hashFiles('CreateRelease.ps1') }}
          restore-keys: |
            ${{ runner.os }}-pwsh-modules-

      - name: Install build dependencies
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module -Name TrustedSigning -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Set target configuration
        shell: pwsh
        run: |
          $branchName = "$env:BRANCH_NAME"
          switch ($branchName) {
            "dev" { $target = "dev"; $targetDescription = "development" }
            "lhm" { $target = "lhm"; $targetDescription = "lhm" }
            default { $target = $branchName; $targetDescription = $branchName }
          }
          Write-Host "Branch: $branchName, Target: $target, Description: $targetDescription"
          echo "TARGET_NAME=$target" >> $env:GITHUB_ENV
          echo "TARGET_DESCRIPTION=$targetDescription" >> $env:GITHUB_ENV

      - name: Ensure branch directory exists
        shell: pwsh
        run: |
          $branchDir = ".\$env:BRANCH_NAME"
          if (-not (Test-Path -Path $branchDir)) { New-Item -Path $branchDir -ItemType Directory }

      - name: Build executable
        shell: pwsh
        run: |
          $branchDir = ".\$env:BRANCH_NAME"
          .\CreateRelease.ps1 -TargetsFile .\targets.psd1 -TargetName $env:TARGET_NAME -SkipSigning
          #copy lastrun.json to branch directory
          Copy-Item -Path .\lastrun.json -Destination "$branchDir\lastrun.json" -Force
          #copy the logs into the destination branch folder if it exists
          if (Test-Path -Path .\logs\CreateRelease.log) { 
            if (-not (Test-Path -Path "$branchDir\logs")) { New-Item -Path "$branchDir\logs" -ItemType Directory }
            Copy-Item -Path .\logs\* -Destination "$branchDir\logs" -Recurse -Force 
          }
          Write-Host "Build complete ($env:BRANCH_NAME using target: $env:TARGET_DESCRIPTION). Executable and lastrun.json are in the $env:BRANCH_NAME directory."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-build-${{ github.ref_name }}
          path: ${{ github.ref_name }}
          retention-days: 14

  sign:
    name: Code Signing (${{ github.ref_name }})
    runs-on: windows-latest
    timeout-minutes: 20
    needs: build
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      BRANCH_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set target configuration
        shell: pwsh
        run: |
          $branchName = "$env:BRANCH_NAME"
          switch ($branchName) {
            "dev" { $target = "dev"; $targetDescription = "development" }
            "lhm" { $target = "lhm"; $targetDescription = "lhm" }
            default { $target = $branchName; $targetDescription = $branchName }
          }
          Write-Host "Branch: $branchName, Target: $target, Description: $targetDescription"
          echo "TARGET_NAME=$target" >> $env:GITHUB_ENV
          echo "TARGET_DESCRIPTION=$targetDescription" >> $env:GITHUB_ENV

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: autopilot-build-${{ github.ref_name }}
          path: ${{ github.ref_name }}

      - name: Skip signing (missing secrets)
        if: env.AZURE_TENANT_ID == '' || env.AZURE_CLIENT_ID == '' || env.AZURE_CLIENT_SECRET == ''
        shell: pwsh
        run: |
          Write-Host "Signing skipped: required Azure Trusted Signing secrets not configured."

      - name: Sign files with Trusted Signing
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: zuhairmahd
          certificate-profile-name: Cert1
          files-folder: ${{ github.workspace }}/${{ github.ref_name }}
          files-folder-filter: exe,dll
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: update hash
        shell: pwsh
        run: |
          $branchDir = ".\$env:BRANCH_NAME"
          #copy lastrun to the root folder from the current directory if it exists.
          if (Test-Path -Path "$branchDir\lastrun.json") { Copy-Item -Path "$branchDir\lastrun.json" -Destination .\lastrun.json -Force }
          .\CreateRelease.ps1 -TargetsFile .\targets.psd1 -TargetName $env:TARGET_NAME -Overwrite -updateHash
          Copy-Item -Path "$branchDir\main.exe" -Destination .\main.exe -Force
          Write-Host "Copied $branchDir\main.exe to .\main.exe."
          Copy-Item -Path "$branchDir\lastrun.json" -Destination .\lastrun.json -Force
          Write-Host "Copied $branchDir\lastrun.json to .\lastrun.json."
          .\CreateRelease.ps1 -InputFile .\main.ps1 -outputPath $env:BRANCH_NAME -Overwrite -updateHash
          copy-item -path .\main.exe -destination "$branchDir\main.exe" -Force
          Write-Host "Updated hash in lastrun.json."

      - name: recreate zip
        shell: pwsh
        run: |
          $branchDir = ".\$env:BRANCH_NAME"
          #copy reset.cmd and reset.ps1 from the tools folder to the target folder.
          if (Test-Path -Path .\tools\reset.cmd) { Copy-Item -Path .\tools\reset.cmd -Destination "$branchDir\reset.cmd" -Force }                   
          if (Test-Path -Path .\tools\reset.ps1) { Copy-Item -Path .\tools\reset.ps1 -Destination "$branchDir\reset.ps1" -Force }
          .\CreateRelease.ps1 -TargetsFile .\targets.psd1 -TargetName $env:TARGET_NAME -Overwrite -CreateZipFileOnly

      - name: Commit signed artifacts to repository
        if: env.AZURE_TENANT_ID != '' && env.AZURE_CLIENT_ID != '' && env.AZURE_CLIENT_SECRET != ''
        shell: pwsh
        run: |
          $branchDir = ".\$env:BRANCH_NAME"
          if (Test-Path -Path "$branchDir\main.exe") { Write-Host "Signed main.exe exists. Copying to root."; Copy-Item -Path "$branchDir\main.exe" -Destination .\main.exe -Force }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A $env:BRANCH_NAME
          git add -A main.exe
          git add -A lastrun.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $branch = '${{ github.ref_name }}'
            git commit -m "chore(build): update signed artifacts ($env:BRANCH_NAME) [skip ci]"
            git push origin HEAD:$branch
            Write-Host "Signed artifacts committed and pushed to $branch"
          }
          else { Write-Host "No changes to commit." }
