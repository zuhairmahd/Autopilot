name: PowerShell CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  tests:
    name: Run PowerShell Tests (Windows, pwsh)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify PowerShell 7
        shell: pwsh
        run: |
          Write-Host "Using PowerShell version: $($PSVersionTable.PSVersion)"
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            Write-Error "PowerShell 7+ is required."
            exit 1
          }

      - name: Run test suite
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\TestScripts\Test-Runner.ps1 -TestCategory syntax
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\TestScripts\Test-Runner.ps1 -TestCategory integration
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\TestScripts\Test-Runner.ps1 -TestCategory core

  code-analysis:
    needs: [tests]
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install PSScriptAnalyzer
      shell: powershell
      run: |
        Install-Module -Name PSScriptAnalyzer -Force -SkipPublisherCheck
    
    - name: Run PSScriptAnalyzer
      shell: powershell
      run: |
        $results = Invoke-ScriptAnalyzer -Path *.ps1 -Recurse -Severity Error
        if ($results) {
          $results | Format-Table -AutoSize
          Write-Error "PSScriptAnalyzer found issues"
          exit 1
        } else {
          Write-Host "PSScriptAnalyzer passed"
        }
  